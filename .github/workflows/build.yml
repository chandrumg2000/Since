name: Build Since iOS App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode and Environment
        run: |
          xcodebuild -version
          xcodebuild -project Since.xcodeproj -list

      - name: Build iOS Application
        run: |
          xcodebuild clean build \
            -project Since.xcodeproj \
            -scheme Since \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            VALIDATE_EMBEDDED_BINARIES=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Since.app Payload/
          zip -r Since.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Since-iOS-App
          path: Since.ipa
          retention-days: 14
